MODEL:
  SEGMENTOR_CKPT: 'ckpts/segmentor.ckpt' # placeholder, should be overwritten
  BACKBONE:
    NAME: DINOv2
  OOD_HEAD:
    NAME: GMMSegHead
    EMBEDDING_DIM: 1024 # this should match the output_dim of the backbone, consistency rule is added in the code
    NUM_CLASSES: 1
    NUM_COMPONENTS_PER_CLASS: 5
    UPDATE_INTERVAL: 3
    GAMMA_MEAN: 0.999
    GAMMA_COV: 0
    MEMORY_SIZE: 8000 
    SINKHORN_FACTORS: [1,1,1]
    MAX_SAMPLE_SIZE: 20 
    IGNORE_CLASS: 255
    DISTRIBUTED_TRAINING: True
  IGNORE_INDEX: 255
  LOSS:
    NAME: likelihood_ratio
    GMM_LOSS_WEIGHT: 0.0
    EPS: 1e-6
    CONTRAST_LOSS_WEIGHT: 0.01
  
SOLVER:
  LR: 5.0e-4
  OPTIMIZER: AdamW
  WEIGHT_DECAY: 0.0
  LR_SCHEDULER: 
    NAME: PolyWithLinearWarmup
    NUM_WARMUP_STEPS: 1500
    LR_END: 1.0e-7
    POWER: 1.0
    LAST_EPOCH: -1
  BATCH_SIZE: 1 # per GPU, should be scaled accordingly change to 8
  PRECISION: bf16-mixed
  MAX_STEPS: 4000
  LOG_EVERY_N_STEPS: 100
  NUM_WORKERS: 1 #change to 20
  VAL_CHECK_INTERVAL: 2000
  EVAL_MODE: sliding_window
  EVAL_WINDOW_SIZE: [308, 406]
  EVAL_STRIDE: [140, 140]

DATA:
  MODULE: SemanticSegmentation
  NAME: carla_ood
  DATASET_ROOT: '/home/nicholas/Desktop/main_UE4/output_normal'
  DATASETS_FOLDER: 'datasets/'
  TARGET_TYPE: semantic_trainids
  EVAL_DATASET: cityscapes
  OOD_LABEL: 254
  OOD_PROB: 1 #CHANGE to 0.2 / 0.3
  COCO_ROOT: '/COCO/'
  COCO_PROXY_SIZE: 30000

CKPT:
  DIR_PATH: ckpts/d_d/

WANDB:
  ACTIVATE: False
  RUN_NAME: gmmseg_ood_head
  PROJECT: LR_OoD

RANDOM_SEED: 2000